<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UKUI Fusion Desktop · 交互原型</title>
<style>
/* ============================================================
   0. 设计令牌 (Design Tokens)
   UKUI Fusion —— 银河麒麟 UKUI 交互骨架 + Plasma 层次/动效 + XFCE 克制
   ============================================================ */
:root{
  /* —— 品牌色 —— */
  --brand-50:#E8F3FF;  --brand-100:#CCE4FF; --brand-200:#9CC8FF;
  --brand-500:#3790FA; --brand-600:#2A7CE8; --brand-700:#1F62C4; --brand-800:#17509E;
  /* —— 中性/表面 —— */
  --surface-0:#FFFFFF; --surface-1:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#EDF0F6;
  --surface-glass:rgba(255,255,255,.86);
  --border-1:#E4E8F0; --border-2:#D3D9E4;
  /* —— 文本 —— */
  --text-1:#1F2329; --text-2:#4E5969; --text-3:#86909C; --text-inv:#FFFFFF;
  /* —— 语义色 —— */
  --success:#23B26D; --warning:#FF9A2E; --danger:#EF5350; --info:#3790FA;
  --danger-hover:#E23C39;
  /* —— 圆角 —— */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:999px;
  --win-radius:10px;
  /* —— 阴影（四级高度） —— */
  --e1:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  --e2:0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
  --e3:0 12px 20px -6px rgba(16,24,40,.14), 0 4px 8px -4px rgba(16,24,40,.08);
  --e4:0 24px 48px -12px rgba(16,24,40,.24), 0 8px 16px -8px rgba(16,24,40,.12);
  /* —— 动效 —— */
  --t-fast:120ms; --t-base:200ms; --t-slow:320ms;
  --ease-std:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
  /* —— 尺度 —— */
  --tb-h:48px;           /* 任务栏高度 */
  --icon-cell:92px;      /* 桌面图标网格单元 */
  --gap:8px;
  --panel-pad:12px;
  --win-min-w:360px;     /* 窗口最小尺寸（低分辨率档自动下调） */
  --win-min-h:220px;
  --menu-w:344px;        /* 开始菜单宽度 */
  --ui-fs:14px;          /* 基准字号 */
  --font: "Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono: "JetBrains Mono","Noto Sans Mono CJK SC",ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ============================================================
   0.1 密度档位（低分辨率降级）
   xs ≤900(含 800×600)  sm ≤1280  md ≤1920  lg ≥2560
   原则：先压缩尺寸与间距，再隐藏次要元素，最后折叠进溢出菜单
   —— 任何情况下都保证「可点元素可达」
   ============================================================ */
html[data-size="xs"]{
  --tb-h:38px; --icon-cell:74px; --gap:6px; --panel-pad:8px;
  --win-min-w:300px; --win-min-h:180px; --menu-w:292px;
  --win-radius:8px; --ui-fs:13px;
  --r-lg:10px;
}
html[data-size="sm"]{
  --tb-h:42px; --icon-cell:86px; --gap:8px;
  --win-min-w:340px; --win-min-h:200px; --menu-w:320px;
}
html[data-size="lg"]{
  --tb-h:56px; --icon-cell:104px; --menu-w:400px;
}
[data-theme="dark"]{
  --brand-500:#4C9DFB; --brand-600:#3B8BF0; --brand-700:#2E74D2;
  --surface-0:#171A1F; --surface-1:#1E2229; --surface-2:#262B33; --surface-3:#2F3540;
  --surface-glass:rgba(30,34,41,.86);
  --border-1:#363C46; --border-2:#454C58;
  --text-1:#E8EAED; --text-2:#AAB1BD; --text-3:#7C8492;
  --e1:0 1px 2px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.30);
  --e2:0 4px 8px -2px rgba(0,0,0,.45), 0 2px 4px -2px rgba(0,0,0,.30);
  --e3:0 12px 20px -6px rgba(0,0,0,.55), 0 4px 8px -4px rgba(0,0,0,.35);
  --e4:0 24px 48px -12px rgba(0,0,0,.65), 0 8px 16px -8px rgba(0,0,0,.40);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); font-size:14px; color:var(--text-1);
  background:#DFE3EA; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-500); outline-offset:2px; border-radius:var(--r-xs)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   1. 舞台 / 分辨率模拟
   ============================================================ */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
#viewport{
  position:relative; width:1920px; height:1080px; flex:none;
  transform-origin:center center; border-radius:6px; overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(16,24,40,.45), 0 0 0 1px rgba(16,24,40,.12);
  background:#0B1220;
}

/* ============================================================
   2. 桌面
   ============================================================ */
#desktop{position:absolute;inset:0;overflow:hidden}
#wallpaper{
  position:absolute;inset:0;
  background:
    radial-gradient(1200px 800px at 18% 12%, rgba(76,157,251,.55), transparent 60%),
    radial-gradient(1000px 700px at 82% 78%, rgba(124,92,255,.45), transparent 62%),
    radial-gradient(900px 600px at 60% 40%, rgba(35,178,109,.28), transparent 60%),
    linear-gradient(160deg,#123A6B 0%,#1B4E8F 38%,#2E74D2 70%,#4C9DFB 100%);
}
[data-theme="dark"] #wallpaper{
  background:
    radial-gradient(1200px 800px at 18% 12%, rgba(55,144,250,.40), transparent 60%),
    radial-gradient(1000px 700px at 82% 78%, rgba(124,92,255,.35), transparent 62%),
    linear-gradient(160deg,#0A1626 0%,#10243C 45%,#1B3A5E 100%);
}
/* 壁纸：纯静态渐变 / 纹理，无实时模糊 —— 软渲染设备上零成本
   （壁纸越界不影响 CPU：只是一次 CSS 属性切换，不触发重排） */
html[data-wall="dawn"] #wallpaper{
  background:
    radial-gradient(1100px 760px at 22% 16%, rgba(255,154,46,.55), transparent 62%),
    radial-gradient(900px 640px at 80% 76%, rgba(239,83,80,.42), transparent 60%),
    linear-gradient(160deg,#5B2A17 0%,#8A4216 40%,#D2691E 72%,#FFB067 100%);
}
html[data-wall="forest"] #wallpaper{
  background:
    radial-gradient(1100px 760px at 20% 18%, rgba(35,178,109,.50), transparent 62%),
    radial-gradient(900px 640px at 78% 80%, rgba(55,144,250,.35), transparent 60%),
    linear-gradient(160deg,#08321F 0%,#12533A 42%,#1E7A55 74%,#3FA97C 100%);
}
html[data-wall="ink"] #wallpaper{
  background:
    radial-gradient(1100px 760px at 24% 14%, rgba(160,174,192,.30), transparent 62%),
    radial-gradient(900px 640px at 76% 80%, rgba(90,104,126,.34), transparent 60%),
    linear-gradient(160deg,#23272E 0%,#333A44 46%,#4A525E 100%);
}
#wallpaper::after{
  content:"";position:absolute;inset:0;opacity:.14;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.5) 0 1px, transparent 1px 90px),
    repeating-linear-gradient(65deg, rgba(255,255,255,.35) 0 1px, transparent 1px 120px);
}
/* 桌面图标网格 */
#icons{
  position:absolute; left:0; top:0; right:0; bottom:var(--tb-h);
  padding:16px; display:grid; gap:var(--gap); align-content:start; justify-content:start;
  grid-template-columns:repeat(auto-fill, var(--icon-cell));
  grid-auto-rows:var(--icon-cell);
}
.dicon{
  width:var(--icon-cell);height:var(--icon-cell);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  padding:6px 2px;border-radius:var(--r-md);cursor:default;user-select:none;
  transition:background var(--t-fast) var(--ease-std);
}
.dicon .ico{width:48px;height:48px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));transition:transform var(--t-base) var(--ease-out)}
.dicon .lb{
  font-size:12.5px;line-height:1.25;color:#fff;text-align:center;max-width:88px;
  text-shadow:0 1px 3px rgba(0,0,0,.75); padding:1px 4px; border-radius:var(--r-xs);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.dicon:hover{background:rgba(255,255,255,.16)}
.dicon:hover .ico{transform:translateY(-2px) scale(1.04)}
.dicon.sel{background:rgba(55,144,250,.42); box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.dicon.sel .lb{background:var(--brand-500)}

/* ============================================================
   3. 窗口
   ============================================================ */
#winlayer{position:absolute;left:0;top:0;right:0;bottom:var(--tb-h)}
.win{
  position:absolute; display:flex; flex-direction:column;
  background:var(--surface-1); border-radius:var(--win-radius);
  border:1px solid var(--border-1); box-shadow:var(--e2);
  overflow:hidden; min-width:var(--win-min-w); min-height:var(--win-min-h);
  transition:left var(--t-slow) var(--ease-std), top var(--t-slow) var(--ease-std),
             width var(--t-slow) var(--ease-std), height var(--t-slow) var(--ease-std),
             opacity var(--t-base) var(--ease-std), transform var(--t-base) var(--ease-out),
             box-shadow var(--t-base) var(--ease-std);
}
.win.active{box-shadow:var(--e3); border-color:var(--border-2)}
.win.dragging,.win.resizing{transition:none; box-shadow:var(--e4); user-select:none}
.win.minimized{opacity:0; transform:scale(.92) translateY(60px); pointer-events:none}
.win.closing{opacity:0; transform:scale(.96); transition:all var(--t-base) var(--ease-std)}
.win.maximized{border-radius:0; border-left:none;border-right:none;border-top:none}
.win.snap-left,.win.snap-right{border-radius:0}
.win.pinned{box-shadow:var(--e3), 0 0 0 2px var(--brand-500)}
.win-head{
  height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 4px 0 10px;
  background:var(--surface-1); border-bottom:1px solid var(--border-1); cursor:default; touch-action:none;
}
.win:not(.active) .win-head{background:var(--surface-2)}
.win:not(.active) .win-title{color:var(--text-3)}
.win-ico{width:20px;height:20px;flex:none;display:grid;place-items:center}
.win-title{
  font-size:13.5px;font-weight:500;color:var(--text-1); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; flex:1;
}
.win-btns{display:flex;gap:2px;flex:none}
.wb{
  width:30px;height:30px;border-radius:var(--r-sm); display:grid;place-items:center;
  color:var(--text-2); transition:background var(--t-fast) var(--ease-std), color var(--t-fast);
}
.wb:hover{background:var(--surface-3);color:var(--text-1)}
.wb.close:hover{background:var(--danger);color:#fff}
.wb svg{width:14px;height:14px}
.win-body{flex:1; overflow:auto; container-type:inline-size; background:var(--surface-0)}
.win.maximized .win-head{height:38px}
/* 缩放手柄 */
.rs{position:absolute;z-index:5}
.rs.n{left:8px;right:8px;top:-3px;height:8px;cursor:ns-resize}
.rs.s{left:8px;right:8px;bottom:-3px;height:8px;cursor:ns-resize}
.rs.w{top:8px;bottom:8px;left:-3px;width:8px;cursor:ew-resize}
.rs.e{top:8px;bottom:8px;right:-3px;width:8px;cursor:ew-resize}
.rs.ne{top:-3px;right:-3px;width:14px;height:14px;cursor:nesw-resize}
.rs.nw{top:-3px;left:-3px;width:14px;height:14px;cursor:nwse-resize}
.rs.se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
.rs.sw{bottom:-3px;left:-3px;width:14px;height:14px;cursor:nesw-resize}
.win.maximized .rs,.win.snap-left .rs,.win.snap-right .rs{display:none}

/* ============================================================
   4. 窗口内容（演示自适应布局）
   ============================================================ */
.app{flex:1;min-height:0;display:flex}
.sidebar{
  width:180px;flex:none;background:var(--surface-2);border-right:1px solid var(--border-1);
  padding:10px 8px;display:flex;flex-direction:column;gap:2px;
}
.sidebar .sec{font-size:11px;color:var(--text-3);padding:8px 8px 4px;letter-spacing:.4px}
.nav-i{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r-sm);
  font-size:13px;color:var(--text-2);transition:background var(--t-fast) var(--ease-std);
}
.nav-i:hover{background:var(--surface-3);color:var(--text-1)}
.nav-i.on{background:var(--brand-50);color:var(--brand-700);font-weight:500}
[data-theme="dark"] .nav-i.on{background:rgba(76,157,251,.18);color:var(--brand-500)}
.nav-i svg{width:16px;height:16px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.toolbar{
  height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;
  border-bottom:1px solid var(--border-1);background:var(--surface-1);
}
.tb-btn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2)}
.tb-btn:hover{background:var(--surface-3);color:var(--text-1)}
.tb-btn svg{width:16px;height:16px}
.path{
  flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--surface-2);border:1px solid var(--border-1);border-radius:var(--r-sm);
  font-size:12.5px;color:var(--text-2);overflow:hidden;white-space:nowrap;
}
.searchbox{width:180px;flex:none}
.searchbox input, .inp{
  width:100%;height:30px;padding:0 10px;border-radius:var(--r-sm);
  border:1px solid var(--border-1);background:var(--surface-2);color:var(--text-1);font:inherit;font-size:12.5px;
  transition:border-color var(--t-fast) var(--ease-std), box-shadow var(--t-fast) var(--ease-std);
}
.searchbox input:focus,.inp:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(55,144,250,.16)}
.grid-files{flex:1;overflow:auto;padding:12px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));align-content:start}
.fcell{
  padding:12px 6px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:background var(--t-fast) var(--ease-std); cursor:default;
}
.fcell:hover{background:var(--surface-2)}
.fcell .lb{font-size:12px;color:var(--text-2);text-align:center;word-break:break-all;line-height:1.3}
.fcell.on{background:var(--brand-50)}
[data-theme="dark"] .fcell.on{background:rgba(76,157,251,.16)}
/* 设置页 */
.set-wrap{flex:1;overflow:auto;padding:16px}
.card{
  background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--r-lg);
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--e1);
}
.card h4{font-size:13.5px;font-weight:600;margin-bottom:4px}
.card p{font-size:12.5px;color:var(--text-2);line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-1)}
.row:last-child{border-bottom:none}
.row .t{font-size:13px}
.row .d{font-size:12px;color:var(--text-3);margin-top:2px}
.sw{
  width:42px;height:24px;border-radius:var(--r-full);background:var(--border-2);position:relative;flex:none;
  transition:background var(--t-base) var(--ease-std);
}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:var(--e1); transition:transform var(--t-base) var(--ease-out);
}
.sw.on{background:var(--brand-500)}
.sw.on::after{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  padding:6px 12px;border-radius:var(--r-full);font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--border-1);color:var(--text-2);transition:all var(--t-fast) var(--ease-std);
}
.chip:hover{border-color:var(--brand-500);color:var(--brand-600)}
.chip.on{background:var(--brand-500);color:#fff;border-color:var(--brand-500)}
/* 终端 */
.term{
  flex:1;background:#101720;color:#C7D3E0;font-family:var(--mono);font-size:12.5px;line-height:1.75;
  padding:12px 14px;overflow:auto;
}
[data-theme="dark"] .term{background:#0C1015}
.term .g{color:#5FC98A}.term .b{color:#6FB3F5}.term .y{color:#E5C07B}.term .dim{color:#6B7787}
.term .prompt{color:#3790FA}
/* 编辑器 */
.ed{flex:1;display:flex;flex-direction:column;min-height:0}
.ed-bar{height:38px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--border-1);font-size:12.5px;color:var(--text-2)}
.ed-body{flex:1;display:flex;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.9}
.ln{flex:none;width:52px;background:var(--surface-2);color:var(--text-3);text-align:right;padding:10px 10px 10px 0;user-select:none;border-right:1px solid var(--border-1)}
.code{flex:1;padding:10px 14px;color:var(--text-1);white-space:pre;overflow:auto}
/* 音乐 */
.music{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.cover{
  width:150px;height:150px;border-radius:var(--r-lg);box-shadow:var(--e3);flex:none;
  background:linear-gradient(140deg,#3790FA,#7C5CFF 55%,#23B26D);
}
.music h3{font-size:15px;font-weight:600}
.music .sub{font-size:12.5px;color:var(--text-3);margin-top:-8px}
.bar{width:min(320px,90%);height:4px;border-radius:var(--r-full);background:var(--surface-3);position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;width:38%;background:var(--brand-500);border-radius:var(--r-full)}
.ctrls{display:flex;align-items:center;gap:16px;color:var(--text-2)}
.ctrls button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background var(--t-fast)}
.ctrls button:hover{background:var(--surface-3);color:var(--text-1)}
.ctrls .play{width:44px;height:44px;background:var(--brand-500);color:#fff}
.ctrls .play:hover{background:var(--brand-600);color:#fff}
/* 容器查询：窗口变窄时的自适应 */
.app{container-type:inline-size}
@container (max-width: 560px){
  .sidebar{width:56px;padding:8px 6px}
  .sidebar .sec{display:none}
  .nav-i{justify-content:center;padding:9px 0}
  .nav-i span{display:none}
  .searchbox{width:120px}
}
@container (max-width: 380px){
  /* 不再隐藏侧栏（否则导航不可达），改为顶部横向滚动条 */
  .app{flex-wrap:wrap}
  .sidebar{
    flex:0 0 100%;width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    border-right:none;border-bottom:1px solid var(--border-1);padding:6px 8px;gap:4px;
  }
  .sidebar .sec{display:none}
  .sidebar .nav-i{white-space:nowrap;padding:7px 10px;background:var(--surface-1);border:1px solid var(--border-1)}
  .main{flex:1 1 100%;min-width:0}
  .toolbar{height:40px}
}
/* 空状态 */
.empty{flex:1;display:grid;place-items:center;color:var(--text-3);font-size:13px;padding:24px;text-align:center}

/* ============================================================
   4.5 设置中心（模块化 · 每模块一个独立 DEB）
   性能优先：扁平背景、无毛玻璃、无二级动画；页面惰性构建 + 缓存
   ============================================================ */
.set-head{
  height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--border-1);background:var(--surface-1);
}
.set-head .ttl{font-size:14px;font-weight:600;flex:none}
.set-head .sbx{width:min(210px,40%);margin-left:auto;min-width:96px}
.set-head .sbx input{height:28px;font-size:12.5px}
.set-head .perf{
  flex:none;font-size:11px;color:var(--text-3);padding:3px 9px;border-radius:var(--r-full);
  background:var(--surface-2);border:1px solid var(--border-1);font-variant-numeric:tabular-nums;
}
.set-head .perf b{color:var(--success);font-weight:600}
.mod-nav{padding:8px 6px}
.mod-nav .nav-i{position:relative;border-radius:var(--r-sm)}
.mod-nav .nav-i .sz{display:none;margin-left:auto;font-size:10px;color:var(--text-3);font-family:var(--mono)}
.mod-nav.show-pkg .nav-i .sz{display:block}
.mod-nav .nav-i .dot-new{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--brand-500)}
.mod-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mod-hd .ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.mod-hd .ic svg{width:22px;height:22px}
.mod-hd .nm{font-size:15px;font-weight:600;line-height:1.3}
.mod-hd .pk{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.mod-hd .run{margin-left:auto;flex:none}
.btn{
  padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;border:1px solid var(--border-1);
  background:var(--surface-2);color:var(--text-2);transition:background var(--t-fast) var(--ease-std),border-color var(--t-fast);
}
.btn:hover{border-color:var(--brand-500);color:var(--brand-600)}
.btn.primary{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
.btn.primary:hover{background:var(--brand-600);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.sl{
  flex:none;width:130px;height:4px;border-radius:var(--r-full);background:var(--surface-3);
  position:relative;cursor:pointer;
}
.sl i{position:absolute;left:0;top:0;height:100%;background:var(--brand-500);border-radius:var(--r-full)}
.sl b{
  position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;
  background:#fff;border:2px solid var(--brand-500);box-shadow:var(--e1);pointer-events:none;
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:12.5px}
.kv dt{color:var(--text-3);white-space:nowrap}
.kv dd{color:var(--text-1);font-family:var(--mono);font-size:12px;word-break:break-all}
.pkg-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-1)}
.pkg-row:last-child{border-bottom:none}
.pkg-row .nm{font-size:13px}
.pkg-row .pn{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:2px}
.pkg-row .ops{margin-left:auto;display:flex;gap:6px;flex:none}
.pkg-state{
  font-size:11px;padding:2px 8px;border-radius:var(--r-full);background:var(--surface-3);
  color:var(--text-3);flex:none;white-space:nowrap;
}
.pkg-state.on{background:rgba(35,178,109,.14);color:#178A54}
[data-theme="dark"] .pkg-state.on{background:rgba(35,178,109,.20);color:#4FC98B}
.note-bar{
  display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border-1);font-size:12px;color:var(--text-2);
  line-height:1.6;margin-bottom:10px;
}
.note-bar svg{width:16px;height:16px;flex:none;color:var(--brand-500);margin-top:1px}
.set-res{padding:9px 10px;border-radius:var(--r-md);cursor:default;transition:background var(--t-fast)}
.set-res:hover{background:var(--surface-2)}
.set-res .t{font-size:13px}
.set-res .d{font-size:11.5px;color:var(--text-3);margin-top:2px}
@container (max-width: 520px){
  .set-head .sbx{display:none}
  .mod-hd .run{display:none}
  .sl{width:96px}
}

/* ============================================================
   5. 任务栏
   ============================================================ */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--surface-glass);
  -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  border-top:1px solid var(--border-1); box-shadow:0 -2px 12px rgba(16,24,40,.06);
  z-index:5000; color:var(--text-1);
}
.tb-start{
  height:36px;padding:0 12px;border-radius:var(--r-md);display:flex;align-items:center;gap:8px;flex:none;
  font-size:13.5px;font-weight:500;transition:background var(--t-fast) var(--ease-std),transform var(--t-fast) var(--ease-out);
}
.tb-start:hover{background:var(--surface-3);transform:translateY(-1px)}
.tb-start.on{background:var(--brand-500);color:#fff}
.tb-start svg{width:20px;height:20px}
.tb-sep{width:1px;height:24px;background:var(--border-1);flex:none;margin:0 4px}
.tb-quick{display:flex;gap:2px;flex:none}
.qbtn{
  width:38px;height:38px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--text-2);
  transition:background var(--t-fast) var(--ease-std),transform var(--t-fast) var(--ease-out);
}
.qbtn:hover{background:var(--surface-3);color:var(--text-1);transform:translateY(-2px)}
.qbtn svg{width:22px;height:22px}
.tb-tasks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
.ttask{
  height:38px;min-width:44px;max-width:220px;flex:0 1 180px;
  display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r-md);
  color:var(--text-2);position:relative;overflow:hidden;
  transition:background var(--t-fast) var(--ease-std),color var(--t-fast);
}
.ttask:hover{background:var(--surface-3);color:var(--text-1)}
.ttask svg{width:20px;height:20px;flex:none}
.ttask .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ttask.active{background:var(--brand-500);color:#fff;font-weight:500}
.ttask.active::after{
  content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:rgba(255,255,255,.9);
}
.ttask.min{opacity:.55}
.ttask .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-500);flex:none}
.ttask.active .dot{background:#fff}
.tb-tray{display:flex;align-items:center;gap:2px;flex:none}
.tray-btn{
  height:36px;min-width:36px;padding:0 8px;border-radius:var(--r-sm);display:flex;align-items:center;gap:6px;
  color:var(--text-2);font-size:12.5px;transition:background var(--t-fast) var(--ease-std);
}
.tray-btn:hover{background:var(--surface-3);color:var(--text-1)}
.tray-btn.on{background:var(--surface-3);color:var(--text-1)}
.tray-btn svg{width:18px;height:18px}
.tray-btn .badge{
  position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--danger);
  box-shadow:0 0 0 2px var(--surface-1);
}
.bell-wrap{position:relative}
#clock{
  height:38px;padding:0 10px;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:flex-end;
  justify-content:center;color:var(--text-1);transition:background var(--t-fast) var(--ease-std);
}
#clock:hover,#clock.on{background:var(--surface-3)}
#clock .h{font-size:13px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
#clock .d{font-size:11px;color:var(--text-3);line-height:1.2}
.show-desktop{width:8px;height:26px;border-radius:2px;background:var(--border-2);margin-left:4px;transition:background var(--t-fast)}
.show-desktop:hover{background:var(--brand-500)}

/* ============================================================
   5.1 任务栏降级阶梯 —— 保证低分辨率下「全部可点」
   降级顺序：压缩 → 隐藏次要文字 → 折叠快速启动/托盘 → 任务溢出菜单
   任何被折叠的元素都必须能在溢出菜单里找到，不允许直接裁掉
   ============================================================ */
html[data-size="xs"] #taskbar{gap:3px;padding:0 4px}
html[data-size="xs"] .tb-start{width:34px;padding:0;justify-content:center}
html[data-size="xs"] .tb-start .lbl{display:none}
html[data-size="xs"] .tb-sep{display:none}
html[data-size="xs"] .tb-quick{display:none}
html[data-size="xs"] .qbtn{width:32px;height:32px}
html[data-size="xs"] .tray-btn{min-width:30px;height:30px;padding:0 4px}
html[data-size="xs"] .tray-btn .txt{display:none}
html[data-size="xs"] #clock{padding:0 5px}
html[data-size="xs"] #clock .d{display:none}
html[data-size="xs"] #clock .h{font-size:12px}
html[data-size="xs"] .show-desktop{width:6px;height:22px;margin-left:2px}
html[data-size="sm"] #clock .d{font-size:10.5px}
html[data-size="sm"] .ttask{max-width:150px;flex-basis:150px}
html[data-size="sm"] .tb-start{padding:0 8px}
/* 任务按钮：图标-only 紧凑态（空间不足时自动开启） */
.tb-tasks.icon-only .ttask{max-width:42px;flex:0 0 42px;padding:0;justify-content:center}
.tb-tasks.icon-only .ttask .t,
.tb-tasks.icon-only .ttask .dot{display:none}
.task-more{
  display:none;height:32px;min-width:30px;padding:0 6px;border-radius:var(--r-sm);flex:none;
  align-items:center;justify-content:center;gap:3px;color:var(--text-2);font-size:11px;
  transition:background var(--t-fast) var(--ease-std);
}
.task-more:hover{background:var(--surface-3);color:var(--text-1)}
.task-more svg{width:14px;height:14px}
#taskbar.has-more .task-more{display:flex}
/* 快速启动 / 托盘溢出（xs 档） */
.more-btn{
  display:none;height:32px;min-width:28px;border-radius:var(--r-sm);align-items:center;justify-content:center;
  color:var(--text-2);flex:none;
}
.more-btn:hover{background:var(--surface-3);color:var(--text-1)}
html[data-size="xs"] .more-btn{display:flex}
html[data-size="xs"] .tb-quick.collapsed{display:none}

/* ============================================================
   6. 弹层：菜单 / 启动器 / 通知 / 日历
   ============================================================ */
.pop{
  position:absolute; z-index:6000; background:var(--surface-glass);
  -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--border-1); border-radius:var(--r-lg); box-shadow:var(--e4);
  color:var(--text-1); overflow:hidden; opacity:0; transform:scale(.97) translateY(6px);
  transition:opacity var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
  pointer-events:none;
}
.pop.show{opacity:1;transform:none;pointer-events:auto}
/* 右键菜单 */
#ctx{z-index:7000;min-width:190px;padding:6px}
.mi{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  font-size:13px;color:var(--text-1);cursor:default;white-space:nowrap;
  transition:background var(--t-fast) var(--ease-std);
}
.mi:hover{background:var(--brand-500);color:#fff}
.mi svg{width:16px;height:16px;flex:none;opacity:.85}
.mi .k{margin-left:auto;font-size:11.5px;opacity:.6}
.mi.danger:hover{background:var(--danger)}
.mi[disabled]{opacity:.4;pointer-events:none}
.msep{height:1px;background:var(--border-1);margin:5px 6px}
/* 开始菜单：紧凑单页（Whisker 演进 · 低开销范式）
   固定尺寸 · 单一视图 · 单列列表 —— 软渲染下最稳的范式 */
#start{
  width:var(--menu-w,344px);height:min(486px,66vh);left:8px;bottom:calc(var(--tb-h) + 8px);
  display:flex;flex-direction:column;
}
#start .s-top{padding:10px 12px;flex:none;border-bottom:1px solid var(--border-1)}
#start .s-search{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border-1)}
#start .s-search svg{width:16px;height:16px;flex:none;color:var(--text-3)}
#start .s-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text-1);font:inherit;font-size:13px}
#start .s-main{flex:1;min-height:0;display:flex}
#start .s-cats{
  width:76px;flex:none;background:var(--surface-2);border-right:1px solid var(--border-1);
  padding:6px 0;display:flex;flex-direction:column;gap:2px;overflow:auto;
}
.cat{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;margin:0 5px;
  border-radius:var(--r-sm);color:var(--text-2);transition:background var(--t-fast) var(--ease-std);
}
.cat svg{width:18px;height:18px}
.cat span{font-size:11px;line-height:1}
.cat:hover{background:var(--surface-3);color:var(--text-1)}
.cat.on{background:var(--brand-500);color:#fff}
#start .s-list{flex:1;min-width:0;overflow:auto;padding:4px}
.app-row{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;border-radius:var(--r-md);
  color:var(--text-1);transition:background var(--t-fast) var(--ease-std);cursor:default;
}
.app-row .ic{width:24px;height:24px;flex:none;border-radius:5px;overflow:hidden}
.app-row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-row .tg{margin-left:auto;font-size:11px;color:var(--text-3);opacity:0;flex:none}
.app-row:hover{background:var(--surface-3)}
.app-row:hover .tg{opacity:1}
.app-row.sel{background:var(--brand-500);color:#fff}
.app-row.sel .tg{color:rgba(255,255,255,.85);opacity:1}
#start .s-foot{
  height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  border-top:1px solid var(--border-1);background:var(--surface-2);
}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#3790FA,#7C5CFF);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.who{font-size:12.5px;line-height:1.2}
.who i{display:block;font-style:normal;font-size:11px;color:var(--text-3)}
.pw{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.pw:hover{background:var(--surface-3);color:var(--danger)}
.pw svg{width:18px;height:18px}

/* ============================================================
   性能分级（Perf Tier）—— 面向无 GPU / llvmpipe 软渲染设备
   full     毛玻璃 + 四级阴影 + 320ms 动效
   balanced 静态半透明 + 静态阴影 + 200ms 动效（无实时模糊）
   minimal  纯色不透明 + 描边替代阴影 + 仅 120ms 淡入（无位移缩放）
   ============================================================ */
body[data-perf="balanced"]{--surface-glass:rgba(255,255,255,.97);--t-slow:200ms}
[data-theme="dark"] body[data-perf="balanced"],body[data-perf="balanced"][data-theme="dark"]{--surface-glass:rgba(30,34,41,.97)}
body[data-perf="balanced"] #taskbar,
body[data-perf="balanced"] .pop,
body[data-perf="balanced"] .toast{backdrop-filter:none;-webkit-backdrop-filter:none}

body[data-perf="minimal"]{
  --t-fast:0ms; --t-base:120ms; --t-slow:0ms;
  --e1:none; --e2:none; --e3:none; --e4:none;
  --surface-glass:var(--surface-1);
}
body[data-perf="minimal"] #taskbar,
body[data-perf="minimal"] .pop,
body[data-perf="minimal"] .toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface-1)}
body[data-perf="minimal"] .pop{transform:none}
body[data-perf="minimal"] .pop.show{transform:none}
body[data-perf="minimal"] .win.minimized{transform:none}
body[data-perf="minimal"] .win,
body[data-perf="minimal"] .card,
body[data-perf="minimal"] .ncard,
body[data-perf="minimal"] .toast,
body[data-perf="minimal"] #switcher .sw-box{box-shadow:none}
body[data-perf="minimal"] .qbtn:hover,
body[data-perf="minimal"] .tb-start:hover,
body[data-perf="minimal"] .dicon:hover .ico,
body[data-perf="minimal"] .sw-it.sel,
body[data-perf="minimal"] .ncard:hover{transform:none}
body[data-perf="minimal"] .win.pinned{box-shadow:none;border-color:var(--brand-500)}
/* 通知中心 */
#notif{
  width:min(380px,34vw); max-height:min(520px,68vh); right:8px; bottom:calc(var(--tb-h) + 8px);
  display:flex;flex-direction:column;
}
#notif .n-head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border-1);font-weight:600;font-size:14px}
.link{font-size:12.5px;color:var(--brand-500);padding:4px 8px;border-radius:var(--r-sm)}
.link:hover{background:var(--surface-3)}
#notif .n-list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.ncard{
  background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--r-md);padding:12px;
  box-shadow:var(--e1); transition:box-shadow var(--t-base) var(--ease-std),transform var(--t-base) var(--ease-out);
}
.ncard:hover{box-shadow:var(--e2);transform:translateX(-2px)}
.ncard.unread{border-left:3px solid var(--brand-500)}
.ncard .nh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ncard .nh .ap{font-size:13px;font-weight:600}
.ncard .nh .tm{font-size:11px;color:var(--text-3);margin-left:auto}
.ncard .nb{font-size:12.5px;color:var(--text-2);line-height:1.6}
.ncard .na{display:flex;gap:8px;margin-top:10px}
.mini{padding:5px 12px;border-radius:var(--r-sm);font-size:12px;background:var(--brand-500);color:#fff}
.mini:hover{background:var(--brand-600)}
.mini.ghost{background:var(--surface-3);color:var(--text-2)}
/* 日历 */
#cal{width:340px;right:8px;bottom:calc(var(--tb-h) + 8px)}
#cal .c-head{padding:14px 16px 8px}
#cal .c-big{font-size:26px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
#cal .c-sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
#cal .c-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 12px 14px}
#cal .wd{text-align:center;font-size:11.5px;color:var(--text-3);padding:4px 0}
#cal .dy{aspect-ratio:1;display:grid;place-items:center;font-size:12.5px;border-radius:var(--r-sm);color:var(--text-2)}
#cal .dy.mut{color:var(--text-3);opacity:.5}
#cal .dy.today{background:var(--brand-500);color:#fff;font-weight:600}
#cal .dy:hover:not(.today){background:var(--surface-3)}
/* 托盘气泡 */
#traypop{width:300px;right:8px;bottom:calc(var(--tb-h) + 8px);padding:14px}
.vol{display:flex;align-items:center;gap:12px;margin-top:10px}
.slider{flex:1;height:4px;border-radius:var(--r-full);background:var(--surface-3);position:relative}
.slider i{position:absolute;left:0;top:0;height:100%;border-radius:var(--r-full);background:var(--brand-500)}
.slider i::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--brand-500);box-shadow:var(--e1)}
.wifi-list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.wifi-i{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:var(--r-sm);font-size:13px}
.wifi-i:hover{background:var(--surface-3)}
.wifi-i .on{margin-left:auto;font-size:11.5px;color:var(--brand-500)}
/* Toast */
#toasts{position:absolute;right:16px;top:16px;z-index:8000;display:flex;flex-direction:column;gap:10px;width:340px}
.toast{
  background:var(--surface-glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--border-1);border-radius:var(--r-md);box-shadow:var(--e3);padding:12px 14px;
  display:flex;gap:10px;opacity:0;transform:translateX(24px);
  transition:opacity var(--t-base) var(--ease-out),transform var(--t-base) var(--ease-out);
}
.toast.in{opacity:1;transform:none}
.toast .ic{width:34px;height:34px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center}
.toast .tt{font-size:13px;font-weight:600}
.toast .tb2{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.5}

/* ============================================================
   7. Alt+Tab 切换器
   ============================================================ */
#switcher{
  position:absolute;inset:0;z-index:9000;display:none;place-items:center;
  background:rgba(16,24,40,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#switcher.on{display:grid}
#switcher .sw-box{
  background:var(--surface-glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--border-1);border-radius:var(--r-lg);box-shadow:var(--e4);padding:14px;
  display:flex;gap:10px;max-width:min(760px,80vw);overflow:auto;
}
.sw-it{
  width:132px;padding:12px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:background var(--t-fast) var(--ease-std),transform var(--t-base) var(--ease-out);
}
.sw-it .lb{font-size:12px;color:var(--text-2);text-align:center;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-it.sel{background:var(--brand-500);color:#fff;transform:translateY(-4px)}
.sw-it.sel .lb{color:#fff}

/* ============================================================
   8. 规范标注层
   ============================================================ */
#annot{position:absolute;inset:0;z-index:9500;pointer-events:none;display:none}
body.annotate #annot{display:block}
.ann{position:absolute;border:1px dashed rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ann .tag{
  position:absolute;background:#111827;color:#fff;font-size:11px;padding:2px 6px;border-radius:var(--r-xs);
  white-space:nowrap;transform:translate(-50%,-50%);
}
.ann.note{
  border-color:#FFD666;background:rgba(255,214,102,.10);border-radius:var(--r-md);padding:8px 10px;
  color:#fff;font-size:11.5px;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.6);border-style:solid;
}
/* 提示条 */
#hint{
  position:absolute;left:50%;bottom:calc(var(--tb-h) + 20px);transform:translateX(-50%);
  background:rgba(17,24,39,.88);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:var(--r-full);
  z-index:9200;opacity:0;transition:opacity var(--t-base);pointer-events:none;white-space:nowrap;
}
#hint.on{opacity:1}

/* ============================================================
   9. 调试栏（原型外壳，不属于桌面设计）
   ============================================================ */
#dev{
  position:fixed;right:16px;top:16px;z-index:10000;width:250px;
  background:rgba(255,255,255,.94);border:1px solid #D9DEE7;border-radius:var(--r-lg);
  box-shadow:var(--e3);font-size:12.5px;color:#1F2329;overflow:hidden;
}
#dev h5{font-size:12px;padding:10px 12px;border-bottom:1px solid #ECEFF4;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
#dev h5 .ar{transition:transform var(--t-base);margin-left:auto}
#dev.closed .body{display:none}
#dev.closed h5 .ar{transform:rotate(-90deg)}
#dev .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}
#dev .grp{display:flex;flex-direction:column;gap:5px}
#dev .lbl{font-size:11px;color:#86909C;letter-spacing:.3px}
#dev .opts{display:flex;flex-wrap:wrap;gap:4px}
#dev .opts.col{flex-direction:column;gap:3px}
#dev .mopt{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;border:1px solid #E4E8F0;
  background:#fff;font-size:11px;color:#4E5969;cursor:pointer;transition:all 120ms;
}
#dev .mopt:hover{border-color:#3790FA}
#dev .mopt .bx{width:11px;height:11px;border-radius:3px;border:1.5px solid #C3CAD6;flex:none}
#dev .mopt.on{background:#EAF3FF;border-color:#3790FA;color:#1F62C4}
#dev .mopt.on .bx{background:#3790FA;border-color:#3790FA}
#dev .mopt .pn{margin-left:auto;font-family:var(--mono);font-size:10px;color:#86909C}
#dev .mopt.builtin{opacity:.75}
.opt{padding:4px 8px;border-radius:var(--r-sm);border:1px solid #E1E6EE;background:#fff;font-size:11.5px;color:#4E5969}
.opt:hover{border-color:var(--brand-500);color:var(--brand-600)}
.opt.on{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
#dev .keys{font-size:11.5px;line-height:1.9;color:#4E5969}
#dev .keys b{display:inline-block;min-width:96px;color:#1F2329;font-weight:500;font-size:11px}
kbd{
  font-family:var(--mono);font-size:10.5px;background:#F2F4F8;border:1px solid #E1E6EE;
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:#1F2329;
}
</style>
</head>

/* ==========================================================================
   通用工具
   ========================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
/* 窗口最小尺寸随密度档变化：xs(≤900) 300×180 / sm(≤1280) 340×200 / 其余 360×220 */
const WIN_MIN = () => {
  switch(document.documentElement.dataset.size){
    case 'xs': return {w:300, h:180};
    case 'sm': return {w:340, h:200};
    default:   return {w:360, h:220};
  }
};
let hintTimer;
function hint(msg){
  const h = $('#hint'); h.textContent = msg; h.classList.add('on');
  clearTimeout(hintTimer); hintTimer = setTimeout(()=>h.classList.remove('on'), 1800);
}
function toast(appKey, title, body){
  const t = el('div','toast');
  t.innerHTML = `<span style="width:34px;height:34px;border-radius:8px;overflow:hidden;flex:none">${icon(appKey||'info')}</span>
    <div><div class="tt">${title}</div><div class="tb2">${body}</div></div>`;
  $('#toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('in'));
  setTimeout(()=>{ t.classList.remove('in'); setTimeout(()=>t.remove(), 220); }, 4200);
}

/* ==========================================================================
   窗口管理器
   ========================================================================== */
const WM = {
  z: 100, seq: 0, list: [], active: null, cascade: 0, peeked: null,

  open(appKey, opts={}){
    const app = APPS[appKey]; if(!app) return;
    app.use = (app.use || 0) + 1;            // 使用频次，供启动器「常用」分类排序
    const layer = $('#winlayer');
    const lw = layer.clientWidth, lh = layer.clientHeight;
    const mn = WIN_MIN();
    const w = clamp(app.w, Math.min(app.minW||mn.w, lw-40), lw-40);
    const h = clamp(app.h, Math.min(mn.h, lh-40), lh-40);
    const off = (this.cascade++ % 7) * 26;
    const x = clamp(Math.round((lw-w)/2) + off - 60, 12, lw-w-12);
    const y = clamp(Math.round((lh-h)/2) + off - 40, 8, lh-h-8);

    const win = el('section','win');
    win.dataset.app = appKey;
    win.dataset.id  = 'w' + (++this.seq);
    win.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++this.z}`;
    win.innerHTML =
      `<header class="win-head">
         <span class="win-ico">${icon(app.icon)}</span>
         <span class="win-title">${opts.title || app.name}</span>
         <span class="win-btns">
           <button class="wb min" title="最小化" aria-label="最小化">${icon('min')}</button>
           <button class="wb max" title="最大化" aria-label="最大化">${icon('max')}</button>
           <button class="wb close" title="关闭" aria-label="关闭">${icon('close')}</button>
         </span>
       </header>
       <div class="win-body">${bodyHTML(appKey)}</div>
       ${['n','s','w','e','ne','nw','se','sw'].map(d=>`<div class="rs ${d}" data-dir="${d}"></div>`).join('')}`;

    layer.appendChild(win);
    const rec = {id:win.dataset.id, app:appKey, win, minimized:false, maximized:false, snap:null, pinned:false,
                 rect:{x,y,w,h}, title: opts.title || app.name};
    win._rec = rec; this.list.push(rec);
    win._t0 = performance.now();                 // 冷启动计时起点（供设置显示首帧耗时）
    bindWin(win, rec);
    this.focus(rec);
    if(appKey === 'settings' || appKey.startsWith('mod:')) mountPanel(appKey, win);   // 首帧优先：先插 DOM，再绑定
    renderTasks();
    return rec;
  },

  focus(rec){
    if(!rec) return;
    if(rec.minimized) this.restore(rec);
    this.list.forEach(r=>r.win.classList.remove('active'));
    rec.win.classList.add('active');
    rec.win.style.zIndex = ++this.z;
    this.active = rec;
    renderTasks();
  },

  focusNext(){
    if(this.list.length < 2) return;
    const order = [...this.list].sort((a,b)=>(+a.win.style.zIndex)-(+b.win.style.zIndex));
    const i = order.indexOf(this.active);
    this.focus(order[(i+1) % order.length]);
  },

  minimize(rec){
    rec.minimized = true; rec.win.classList.add('minimized');
    if(this.active === rec){
      this.active = null; rec.win.classList.remove('active');
      const next = [...this.list].filter(r=>!r.minimized).sort((a,b)=>(+b.win.style.zIndex)-(+a.win.style.zIndex))[0];
      if(next) this.focus(next);
    }
    renderTasks();
  },

  restore(rec){
    rec.minimized = false;
    rec.win.classList.remove('minimized');
    if(rec.maximized) this.applyGeometry(rec,'max');
    renderTasks();
  },

  toggleMax(rec){
    if(rec.maximized){ rec.maximized=false; rec.snap=null; rec.win.classList.remove('maximized'); this.applyGeometry(rec,'rect'); }
    else { rec.maximized=true; rec.snap=null; rec.win.classList.remove('snap-left','snap-right'); rec.win.classList.add('maximized'); this.applyGeometry(rec,'max'); }
    rec.win.querySelector('.wb.max').innerHTML = rec.maximized ? icon('restore') : icon('max');
    renderTasks();
  },

  snap(rec, side){
    rec.maximized=false; rec.win.classList.remove('maximized');
    rec.snap = side;
    rec.win.classList.remove('snap-left','snap-right');
    rec.win.classList.add('snap-' + side);
    rec.win.querySelector('.wb.max').innerHTML = icon('restore');
    const layer = $('#winlayer');
    const lh = layer.clientHeight, lw = layer.clientWidth;
    rec.win.style.transition = 'left var(--t-slow) var(--ease-std), top var(--t-slow) var(--ease-std), width var(--t-slow) var(--ease-std), height var(--t-slow) var(--ease-std)';
    Object.assign(rec.win.style, {top:'0px', height:lh+'px', width:Math.round(lw/2)+'px', left: side==='left' ? '0px' : Math.round(lw/2)+'px'});
    rec.rect = {x: side==='left'?0:Math.round(lw/2), y:0, w:Math.round(lw/2), h:lh};
    this.focus(rec);
  },

  applyGeometry(rec, mode){
    const layer = $('#winlayer');
    if(mode === 'max'){
      Object.assign(rec.win.style, {left:'0px', top:'0px', width:layer.clientWidth+'px', height:layer.clientHeight+'px'});
    } else {
      Object.assign(rec.win.style, {left:rec.rect.x+'px', top:rec.rect.y+'px', width:rec.rect.w+'px', height:rec.rect.h+'px'});
    }
  },

  close(rec){
    if(!rec) return;
    if(rec.app === 'settings'){ SS.win = SS.nav = SS.page = SS.perf = null; }
    rec.win.classList.add('closing');
    setTimeout(()=>rec.win.remove(), 180);
    this.list = this.list.filter(r=>r!==rec);
    if(this.active === rec) this.active = null;
    const next = [...this.list].filter(r=>!r.minimized).sort((a,b)=>(+b.win.style.zIndex)-(+a.win.style.zIndex))[0];
    renderTasks();
    if(next) this.focus(next);
  },

  showDesktop(){
    const anyVisible = this.list.some(r=>!r.minimized);
    if(anyVisible){
      this.peeked = this.list.filter(r=>!r.minimized);
      this.peeked.forEach(r=>{ r.minimized = true; r.win.classList.add('minimized'); r.win.classList.remove('active'); });
      this.active = null; renderTasks();
    } else if(this.peeked){
      this.peeked.forEach(r=>{ r.minimized = false; r.win.classList.remove('minimized'); });
      const last = this.peeked[this.peeked.length-1];
      this.peeked = null;
      if(last) this.focus(last); else renderTasks();
    }
  },
};

/* ---- 窗口交互绑定：拖拽 / 缩放 / 按钮 / 右键 ---- */
function bindWin(win, rec){
  const head = win.querySelector('.win-head');

  win.addEventListener('pointerdown', ()=>WM.focus(rec), true);

  head.addEventListener('dblclick', e => { if(!e.target.closest('.wb')) WM.toggleMax(rec); });
  head.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    winMenu(rec, e.clientX, e.clientY);
  });

  head.addEventListener('pointerdown', e => {
    if(e.target.closest('.wb') || e.button !== 0) return;
    const layer = $('#winlayer');
    const lr = layer.getBoundingClientRect();
    let scale = win.offsetWidth ? win.getBoundingClientRect().width / win.offsetWidth : 1;

    // 从最大化 / 贴靠状态拖出：先还原，再按光标比例重新定位，避免跳动
    if(rec.maximized || rec.snap){
      const ratio = (e.clientX - lr.left) / lr.width;
      if(rec.snap){ rec.snap = null; win.classList.remove('snap-left','snap-right'); win.querySelector('.wb.max').innerHTML = icon('max'); }
      if(rec.maximized) WM.toggleMax(rec); else WM.applyGeometry(rec, 'rect');
      const w2 = win.offsetWidth;
      win.style.left = clamp((e.clientX - lr.left)/scale - ratio*w2, -w2+140, layer.clientWidth-140) + 'px';
      win.style.top  = clamp((e.clientY - lr.top)/scale - 18, 0, layer.clientHeight-40) + 'px';
    }
    const r = win.getBoundingClientRect();
    scale = r.width / win.offsetWidth;
    const ox = (e.clientX - r.left)/scale, oy = (e.clientY - r.top)/scale;
    win.classList.add('dragging');
    const move = ev => {
      const lw = layer.clientWidth, lh = layer.clientHeight, ww = win.offsetWidth, wh = win.offsetHeight;
      let nx = (ev.clientX - lr.left)/scale - ox;
      let ny = (ev.clientY - lr.top)/scale  - oy;
      nx = clamp(nx, -ww + 140, lw - 140);
      ny = clamp(ny, 0, lh - 40);
      win.style.left = nx + 'px'; win.style.top = ny + 'px';
      // 边缘吸附提示（拖到左右/上边缘超过阈值即贴靠预览）
      if(ev.clientX - lr.left < 8) win.dataset.edge = 'left';
      else if(lr.right - ev.clientX < 8) win.dataset.edge = 'right';
      else delete win.dataset.edge;
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      win.classList.remove('dragging');
      const edge = win.dataset.edge; delete win.dataset.edge;
      if(edge) { WM.snap(rec, edge); hint(edge==='left'?'已贴靠左半屏':'已贴靠右半屏'); return; }
      if(ev.clientY - lr.top < 4 && !rec.maximized) { WM.toggleMax(rec); hint('已最大化'); return; }
      rec.rect = {x: parseFloat(win.style.left), y: parseFloat(win.style.top), w: win.offsetWidth, h: win.offsetHeight};
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });

  win.querySelectorAll('.rs').forEach(h => {
    h.addEventListener('pointerdown', e => {
      e.stopPropagation();
      const dir = h.dataset.dir;
      const lr = $('#winlayer').getBoundingClientRect();
      const scale = win.offsetWidth ? win.getBoundingClientRect().width / win.offsetWidth : 1;
      const s = {x:e.clientX, y:e.clientY, l:win.offsetLeft, t:win.offsetTop, w:win.offsetWidth, h:win.offsetHeight};
      win.classList.add('resizing');
      const mn = WIN_MIN();
      const move = ev => {
        const dx = (ev.clientX - s.x)/scale, dy = (ev.clientY - s.y)/scale;
        let {l,t,w:sw,h:sh} = s;
        if(dir.includes('e')) sw = Math.max(mn.w, s.w + dx);
        if(dir.includes('s')) sh = Math.max(mn.h, s.h + dy);
        if(dir.includes('w')){ sw = Math.max(mn.w, s.w - dx); l = s.l + (s.w - sw); }
        if(dir.includes('n')){ sh = Math.max(mn.h, s.h - dy); t = s.t + (s.h - sh); }
        Object.assign(win.style, {left:l+'px', top:Math.max(0,t)+'px', width:sw+'px', height:sh+'px'});
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        win.classList.remove('resizing');
        rec.rect = {x:win.offsetLeft, y:win.offsetTop, w:win.offsetWidth, h:win.offsetHeight};
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  });

  win.querySelector('.wb.min').addEventListener('click', e => { e.stopPropagation(); WM.minimize(rec); });
  win.querySelector('.wb.max').addEventListener('click', e => { e.stopPropagation(); WM.toggleMax(rec); });
  win.querySelector('.wb.close').addEventListener('click', e => { e.stopPropagation(); WM.close(rec); });
}

/* 已安装集合（模拟 dpkg 数据库） */
const INSTALLED = new Set(['power','sound','wallpaper','network','update']);
const modKey = id => 'mod:' + id;
const installedModules = () => MODULES.filter(m => m.builtin || INSTALLED.has(m.id)).sort((a,b)=>a.order-b.order);

/* DEB 装卸：同步 应用清单 / 启动器 / 侧栏 / 独立窗口 */
function syncModuleApps(){
  MODULES.forEach(m => {
    if(m.builtin) return;
    const k = modKey(m.id);
    if(INSTALLED.has(m.id)){
      if(!APPS[k]) APPS[k] = {name:m.name, icon:m.icon, w:520, h:460, minW:280, module:true, use:0};
      PY[k] = m.kw || '';                       // 中文名 + 拼音首字母检索
    } else {
      delete APPS[k];                           // 卸载即从启动器与搜索中消失
    }
  });
}
function setInstalled(id, on){
  const m = MODULES.find(x=>x.id===id);
  if(!m || m.builtin) return;
  on ? INSTALLED.add(id) : INSTALLED.delete(id);
  syncModuleApps();
  if(!on){
    [...WM.list].filter(r=>r.app===modKey(id)).forEach(r=>WM.close(r));   // 卸载即关闭该模块的独立窗口
    delete PAGE_NODES[id];
    if(curModule === id) curModule = (installedModules()[0] || {}).id || 'pkgmgr';
  }
  if(SS.win && SS.win.isConnected){ paintSetNav(); drawSetPage(setQuery); }
  renderStart(); renderModOpts();
  hint(`${m.name} · ${PKG_PREFIX}${m.id} 已${on?'安装':'卸载'}`);
}

const SS = {win:null, nav:null, page:null, perf:null};
let curModule = 'power', setQuery = '';
const PAGE_NODES = Object.create(null);      // 已构建页面节点（复用 = 不重建 DOM）

function settingsHTML(){
  return `<div class="app set-app">

        </div>
        <div class="set-wrap" id="setPage"></div>
      </div>
    </div>`;
}
function standaloneHTML(id){
  const m = MODULES.find(x=>x.id===id);
  if(!m) return `<div class="empty">模块未安装</div>`;
  return `<div class="app set-app">
      <div class="main">
        <div class="set-head">
          <span class="ttl" style="display:flex;align-items:center;gap:8px">

        </div>
        <div class="set-wrap">
          ${ucNote(`本窗口由 <b style="font-family:var(--mono)">${PKG_PREFIX}${m.id}.desktop</b> 单独启动，未加载设置主程序，也未初始化其他模块。`)}
          ${moduleNode(m).innerHTML}
        </div>
      </div>
    </div>`;
}
function mountPanel(appKey, win){
  if(appKey !== 'settings') return;
  SS.win = win; SS.nav = win.querySelector('#setNav');
  SS.page = win.querySelector('#setPage'); SS.perf = win.querySelector('#setPerf');
  if(!SS.page) return;
  paintSetNav();
  drawSetPage(setQuery);
  const ms = Math.max(0.1, performance.now() - (win._t0 || 0));
  if(SS.perf) SS.perf.innerHTML = `冷启动 <b>${ms.toFixed(1)}</b>ms`;
  const inp = win.querySelector('#setSearch');
  if(inp){ let t; inp.addEventListener('input', ev=>{
    clearTimeout(t); const v = ev.target.value;
    t = setTimeout(()=>{ setQuery = v.trim(); drawSetPage(setQuery); }, 200);   // 防抖 + 延迟过滤
  }); }
}
function setPerfLabel(tag, ms){ if(SS.perf) SS.perf.innerHTML = `${tag} <b>${Math.max(0.1,ms).toFixed(1)}</b>ms`; }
function moduleNode(m){
  if(PAGE_NODES[m.id]) return PAGE_NODES[m.id];
  const t0 = performance.now();
  const wrap = document.createElement('div');
  wrap.className = 'mod-page';
  wrap.innerHTML =
    `<div class="mod-hd">
       <span class="ic">${icon(m.icon)}</span>
       <div><div class="nm">${m.name}</div><div class="pk">${m.pkg || PKG_PREFIX+m.id} · ${m.ver} · ${m.size}</div></div>
       ${m.builtin ? `<span class="pkg-state on run">主包内置</span>`
                   : `<button class="btn sm run" data-act="run-alone" data-mod="${m.id}">独立运行</button>`}
     </div>
     ${m.desc ? `<p style="font-size:12.5px;color:var(--text-2);margin:-2px 0 12px;line-height:1.65">${m.desc}</p>` : ''}
     ${m.page()}`;
  wrap.dataset.build = (performance.now()-t0).toFixed(2);
  PAGE_NODES[m.id] = wrap;
  return wrap;
}
function paintSetNav(){
  const nav = SS.nav; if(!nav) return;
  const mods = installedModules();
  nav.innerHTML = `<div class="sec">设置 · ${mods.length} 个模块</div>
    ${mods.map(m=>`<a class="nav-i${m.id===curModule?' on':''}" data-mod="${m.id}" title="${m.pkg||PKG_PREFIX+m.id}">${icon(m.icon)}<span>${m.name}</span></a>`).join('')}
    <div class="sec">未安装 ${MODULES.length - mods.length} 个</div>`;
  nav.querySelectorAll('.nav-i').forEach(a => a.addEventListener('click', ()=>{
    curModule = a.dataset.mod; paintSetNav(); drawSetPage('');
  }));
}
function drawSetPage(q){
  const box = SS.page; if(!box) return;
  const t0 = performance.now();
  box.innerHTML = '';
  if(q){ box.appendChild(searchResults(q)); setPerfLabel('搜索过滤', performance.now()-t0); return; }
  const m = installedModules().find(x=>x.id===curModule);
  if(!m){ box.innerHTML = `<div class="empty">尚未安装任何设置模块<br><span style="font-size:12px">安装 ukui-control-* 软件包后自动出现</span></div>`; return; }
  const node = moduleNode(m);
  box.appendChild(node);
  if(!node.dataset.cached){ node.dataset.cached = '1'; setPerfLabel('首帧构建', parseFloat(node.dataset.build)); }
  else setPerfLabel('缓存复用', performance.now()-t0);
}
function searchResults(q){
  const box = el('div');
  const s = q.toLowerCase();
  const hits = installedModules().filter(m =>
    (m.name + ' ' + (m.kw||'') + ' ' + (m.keys||[]).join(' ')).toLowerCase().includes(s));
  const list = hits.slice(0, 12);            // 结果截断：限制 DOM 规模
  box.innerHTML = `<p style="font-size:12.5px;color:var(--text-2);margin-bottom:10px">匹配 ${hits.length} 个模块${hits.length>list.length?`（显示前 ${list.length} 个）`:''}</p>`
    + (list.length ? list.map(m=>`
        <div class="set-res" data-mod="${m.id}">
          <div class="t">${m.name}</div>
          <div class="d">${m.pkg||PKG_PREFIX+m.id} · ${(m.keys||[]).filter(k=>k.toLowerCase().includes(s)).slice(0,2).join(' / ') || m.desc}</div>
        </div>`).join('') : `<div class="empty">未找到与「${q}」相关的设置项</div>`);
  box.querySelectorAll('.set-res').forEach(r => r.addEventListener('click', ()=>{
    setQuery = ''; const inp = SS.win && SS.win.querySelector('#setSearch'); if(inp) inp.value = '';
    curModule = r.dataset.mod; paintSetNav(); drawSetPage('');
  }));
  return box;
}
function renderModOpts(){
  const box = $('#modOpts'); if(!box) return;
  box.innerHTML = MODULES.filter(m=>!m.builtin).map(m=>{
    const on = INSTALLED.has(m.id);
    return `<button class="mopt${on?' on':''}" data-mod="${m.id}"><span class="bx"></span><span>${m.name}</span><span class="pn">${PKG_PREFIX}${m.id}</span></button>`;
  }).join('');
  box.querySelectorAll('.mopt').forEach(b => b.addEventListener('click', ()=>
    setInstalled(b.dataset.mod, !INSTALLED.has(b.dataset.mod))));
  const n = installedModules().length;
  const info = $('#modInfo');
  if(info) info.innerHTML = `已安装 <b>${n}</b> / ${MODULES.length} 个模块<br>侧栏条目、启动器应用与 .desktop 入口同步更新`;
}

function renderTasks(){
  const box = $('#tasks'); box.innerHTML = '';
  WM.list.forEach(rec => {
    const app = APPS[rec.app];
    const b = el('button','ttask' + (rec === WM.active ? ' active':'') + (rec.minimized ? ' min':''));
    b.title = rec.title;
    b.innerHTML = `${icon(app.icon)}<span class="t">${rec.title}</span>${rec.pinned ? '<span class="dot"></span>':''}`;
    b.addEventListener('click', () => {
      if(rec === WM.active && !rec.minimized) WM.minimize(rec);
      else WM.focus(rec);
    });
    b.addEventListener('contextmenu', e => { e.preventDefault(); winMenu(rec, e.clientX, e.clientY); });
    box.appendChild(b);
  });
  fitTaskbar();
}
/* 任务栏自适应：保证任何被挤压的元素最终都能点得到
   阶梯：① 压缩任务按钮宽度 → ② 图标-only → ③ 最早的按钮进溢出菜单（当前焦点永不被折叠） */
function fitTaskbar(){
  const tb = $('#taskbar'), box = $('#tasks'), more = $('#taskMore');
  if(!tb || !box || !more) return;
  tb.classList.remove('has-more'); box.classList.remove('icon-only');
  const btns = [...box.children];
  btns.forEach(b => { b.style.display = ''; });
  if(!tb.clientWidth) return;                       // 尚未布局（无头环境）时跳过
  if(box.scrollWidth > box.clientWidth + 1) box.classList.add('icon-only');
  let guard = 0, hidden = 0;
  while(box.scrollWidth > box.clientWidth + 1 && guard < btns.length + 4){
    const i = btns.findIndex(b => b.style.display !== 'none' && !b.classList.contains('active'));
    if(i < 0) break;
    btns[i].style.display = 'none'; hidden++; guard++;
  }
  if(hidden){
    tb.classList.add('has-more');
    more.innerHTML = `${icon('dots')}<span>${hidden}</span>`;
  }
}

function openMenu(x, y, items){
  const m = $('#ctx'); m.innerHTML = '';
  items.forEach(it => {
    if(it === '-'){ m.appendChild(el('div','msep')); return; }
    const e = el('div','mi' + (it.danger ? ' danger':''));
    e.innerHTML = `${it.icon ? `<span style="width:16px;height:16px">${icon(it.icon)}</span>` : '<span style="width:16px"></span>'}
      <span>${it.label}</span>${it.key ? `<span class="k">${it.key}</span>`:''}`;
    if(it.disabled) e.setAttribute('disabled','');
    else e.addEventListener('click', () => { closeAllPops('#ctx'); it.action && it.action(); });
    m.appendChild(e);
  });
  const vp = $('#viewport').getBoundingClientRect();
  const sc = $('#viewport').style.transform;
  const scale = parseFloat((sc.match(/scale\(([\d.]+)\)/)||[0,1])[1]);
  m.classList.add('show');
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = clamp((x-vp.left)/scale, 4, $('#viewport').offsetWidth - w - 4) + 'px';
  m.style.top  = clamp((y-vp.top)/scale,  4, $('#viewport').offsetHeight - h - 4) + 'px';
}

const PY = {

  editor:'wenbenbianjiqi wbbjq', music:'yinle yl', browser:'liulanqi llq',
  calc:'jisuanqi jsq', camera:'xiangji xj', mail:'youjian yj',
};
const CATS = [
  {k:'all',   n:'全部', icon:'grid'},
  {k:'freq',  n:'常用', icon:'user'},
  {k:'set',   n:'设置', icon:'settings'},
  {k:'office',n:'办公', icon:'doc'},
  {k:'dev',   n:'开发', icon:'terminal'},
  {k:'media', n:'影音', icon:'music'},
  {k:'sys',   n:'系统', icon:'settings'},
];
const CAT_MAP = {
  office:['editor','mail','calc'],
  dev:['terminal','editor'],
  media:['music','camera'],
  sys:['settings','files','terminal'],
};
let startCat = 'all', startSel = 0, startQuery = '', searchTimer = null;

function appList(cat){
  if(cat === 'all') return Object.keys(APPS);
  if(cat === 'freq'){
    const used = Object.keys(APPS).filter(k => (APPS[k].use||0) > 0).sort((a,b) => APPS[b].use - APPS[a].use);
    return used.length ? used.slice(0,8) : ['files','browser','terminal','settings','editor','mail'];
  }
  if(cat === 'set'){                      // 由已安装的 DEB 模块动态决定
    return installedModules().filter(m=>!m.builtin).map(m => modKey(m.id));
  }
  return CAT_MAP[cat] || [];
}
function matchApps(q){
  const s = q.toLowerCase();
  return Object.keys(APPS).filter(k =>
    APPS[k].name.includes(q) || (PY[k]||'').includes(s)
  ).slice(0, 20);
}
function launch(k){
  const ex = WM.list.find(r => r.app === k);
  ex ? WM.focus(ex) : WM.open(k);
  closeAllPops('#start');
}

function paintCats(){
  $('#sCats').innerHTML = CATS.map(c =>
    `<div class="cat${c.k===startCat?' on':''}" data-cat="${c.k}">${icon(c.icon)}<span>${c.n}</span></div>`).join('');

function paintList(){
  const box = $('#sList');
  const keys = startQuery ? matchApps(startQuery) : appList(startCat);
  if(!keys.length){
    box.innerHTML = `<div class="empty" style="height:100%;font-size:12.5px">${startQuery?`未找到「${startQuery}」相关应用`:'该分类下暂无应用'}</div>`;
    return;
  }
  startSel = clamp(startSel, 0, keys.length-1);
  box.innerHTML = keys.map((k,i) =>
    `<div class="app-row${i===startSel&&startQuery?' sel':''}" data-app="${k}">
       <span class="ic">${icon(APPS[k].icon)}</span>

    e.addEventListener('click', () => launch(e.dataset.app));
    e.addEventListener('mouseenter', () => {
      if(!startQuery) return;
      const rows = $$('#sList .app-row'); const i = rows.indexOf(e);
      if(i >= 0){ startSel = i; rows.forEach((r,j) => r.classList.toggle('sel', j === i)); }
    });
  });
