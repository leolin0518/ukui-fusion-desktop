$('#trayBell').addEventListener('click', () => {
  notifCount ? renderNotif() : renderNotifEmpty();
  showPop('#notif', $('#trayBell'));
});
$('#clock').addEventListener('click', () => { renderCal(); showPop('#cal', $('#clock')); });
$('#clock').addEventListener('contextmenu', e => { e.preventDefault(); taskbarMenu(e.clientX, e.clientY); });
$('#trayNet').addEventListener('click', () => trayPop('net', $('#trayNet')));
$('#trayVol').addEventListener('click', () => trayPop('vol', $('#trayVol')));
$('#trayBat').addEventListener('click', () => trayPop('bat', $('#trayBat')));
$('#peek').addEventListener('click', () => WM.showDesktop());
$('#taskbar').addEventListener('contextmenu', e => {
  if(e.target.closest('.ttask')) return;
  e.preventDefault(); taskbarMenu(e.clientX, e.clientY);
});
$('#desktop').addEventListener('contextmenu', e => {
  if(e.target.closest('.pop') || e.target.closest('#taskbar')) return;
  e.preventDefault();
  desktopMenu(e.clientX, e.clientY);
});
$('#desktop').addEventListener('pointerdown', e => {
  if(e.target.closest('.pop')) return;
  if(!e.target.closest('.win') && !e.target.closest('#taskbar')) closeAllPops();
  else if(!e.target.closest('.ttask') && !e.target.closest('.tray-btn') && !e.target.closest('#startBtn') && !e.target.closest('#clock')) closeAllPops();
  if(!e.target.closest('.dicon')) $$('.dicon').forEach(x=>x.classList.remove('sel'));
});
/* ==========================================================================
   全局委托：开关 / 选项片 / 滑块 / 模块动作
   全部为「行级更新」，不重建整页 —— 低性能设备上的关键手段
   ========================================================================== */
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if(act) handleAct(act.dataset.act, act.dataset.mod, act.dataset.v);

  const sw = e.target.closest('.sw[data-toggle]');
  if(sw){
    sw.classList.toggle('on');
    const k = sw.dataset.key;
    if(k) MOD_ST[k] = sw.classList.contains('on');
    return;
  }
  const pick = e.target.closest('.chip[data-pick]');
  if(pick){
    const key = pick.dataset.key, v = pick.dataset.v;
    pick.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    pick.classList.add('on');
    if(key) MOD_ST[key] = v;
    applyPick(key, v);
  }
});
/* 滑块：按下定位 + 拖动（仅在 .sl 内部更新 DOM） */
document.addEventListener('pointerdown', e => {
  const sl = e.target.closest('.sl[data-sl]');
  if(!sl) return;
  e.preventDefault();
  const set = ev => {
    const r = sl.getBoundingClientRect();
    const v = clamp(Math.round((ev.clientX - r.left) / r.width * 100), 0, 100);
    sl.dataset.v = v;
    sl.querySelector('i').style.width = v + '%';
    sl.querySelector('b').style.left = v + '%';
    if(sl.dataset.key) MOD_ST[sl.dataset.key] = v;
  };
  set(e);
  const mv = ev => set(ev);
  const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up);
});
function applyPick(key, v){
  if(key === 'wallpaper.wall') setWall(v);
  else if(key === 'wallpaper.accent'){
    document.documentElement.style.setProperty('--brand-500', v);
    document.documentElement.style.setProperty('--brand-600', v);
  }
  else if(key === 'display.scale') hint('缩放比例需在下次登录时生效');
}
function setWall(v){
  document.documentElement.dataset.wall = v;
  hint('壁纸已切换：' + ((WALLS.find(w=>w.v===v) || {}).n || v));
}
function handleAct(act, mod, v){
  switch(act){
    case 'theme':      setTheme(v); break;
    case 'accent':     hint('强调色：' + v); break;
    case 'res':        setRes(parseInt(v,10)); hint('已切换到 ' + RES[parseInt(v,10)].label); break;
    case 'pkg-add':    setInstalled(mod, true); break;
    case 'pkg-remove': setInstalled(mod, false); break;
    case 'run-alone':  launchModule(mod); break;
    case 'sync-time':  toast('settings','时间已同步','NTP ntp.aliyun.com 偏差 -0.023 秒'); break;
    case 'do-update':  toast('update','更新完成','3 个软件包已安装，无需重启'); hint('更新安装中…'); break;
    case 'hint-pwd':   hint('密码修改需输入当前密码'); break;
    case 'hint-multi': hint('已检测到 2 台显示器'); break;
    default: break;
  }
}
function launchModule(id){
  const k = modKey(id);
  if(!APPS[k]) return;
  const ex = WM.list.find(r=>r.app===k);
  ex ? WM.focus(ex) : WM.open(k);
  hint(`${APPS[k].name} · 由 ${PKG_PREFIX}${id}.desktop 单独启动`);
}

/* ==========================================================================
   快捷键
   ========================================================================== */
let altTab = {on:false, idx:0};
window.addEventListener('keydown', e => {
  const meta = e.metaKey || e.key === 'Meta';
  // Alt+Tab
  if(e.altKey && e.key === 'Tab'){
    e.preventDefault();
    const list = WM.list.filter(r=>!r.minimized);
    if(!list.length) return;
    if(!altTab.on){ altTab = {on:true, idx:0}; renderSwitcher(list); }
    altTab.idx = (altTab.idx + (e.shiftKey ? -1 : 1) + list.length) % list.length;
    paintSwitcher(list);
    return;
  }
  if(e.key === 'Escape'){ closeAllPops(); $('#switcher').classList.remove('on'); return; }
  if(e.key === 'Meta' && !e.repeat){ e.preventDefault(); $('#startBtn').click(); return; }
  if(meta && e.key.toLowerCase() === 'd'){ e.preventDefault(); WM.showDesktop(); return; }
  if(meta && e.key === 'ArrowLeft'){ e.preventDefault(); if(WM.active) WM.snap(WM.active,'left'); return; }
  if(meta && e.key === 'ArrowRight'){ e.preventDefault(); if(WM.active) WM.snap(WM.active,'right'); return; }
  if(meta && e.key === 'ArrowUp'){ e.preventDefault(); if(WM.active && !WM.active.maximized) WM.toggleMax(WM.active); return; }
  if(meta && e.key === 'ArrowDown'){ e.preventDefault(); if(WM.active) WM.active.maximized ? WM.toggleMax(WM.active) : WM.minimize(WM.active); return; }
  if(meta && e.key.toLowerCase() === 'a'){ e.preventDefault(); $('#trayBell').click(); return; }
  if(e.altKey && e.key === 'F4'){ e.preventDefault(); if(WM.active) WM.close(WM.active); return; }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase() === 't'){ e.preventDefault(); WM.open('terminal'); return; }
  if(e.key === 'F5'){ e.preventDefault(); renderIcons(); hint('桌面已刷新'); return; }
  if(e.key.toLowerCase() === 'h' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT'){
    toggleAnnot();
  }
});
window.addEventListener('keyup', e => {
  if(e.key === 'Alt' && altTab.on){
    const list = WM.list.filter(r=>!r.minimized);
    const target = list[altTab.idx];
    $('#switcher').classList.remove('on');
    altTab.on = false;
    if(target) WM.focus(target);
  }
});
function renderSwitcher(list){
  $('#swBox').innerHTML = list.map((r,i)=>
    `<div class="sw-it${i===0?' sel':''}" data-i="${i}">${iconBox(APPS[r.app].icon,40)}<span class="lb">${r.title}</span></div>`).join('');
  $('#switcher').classList.add('on');
}
function paintSwitcher(list){
  $$('#swBox .sw-it').forEach((e,i)=> e.classList.toggle('sel', i === altTab.idx));
}

/* ==========================================================================
   时钟
   ========================================================================== */
function tick(){
  const n = new Date();
  const hh = String(n.getHours()).padStart(2,'0'), mm = String(n.getMinutes()).padStart(2,'0');
  $('#clock .h').textContent = `${hh}:${mm}`;
  $('#clock .d').textContent = `${n.getMonth()+1}月${n.getDate()}日`;
  $('#clock').title = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
}
setInterval(tick, 1000); tick();

/* ==========================================================================
   规范标注层
   ========================================================================== */
function toggleAnnot(){
  document.body.classList.toggle('annotate');
  $('#btnAnnot').classList.toggle('on', document.body.classList.contains('annotate'));
  if(document.body.classList.contains('annotate')) drawAnnot();
}
function drawAnnot(){
  const a = $('#annot'); a.innerHTML = '';
  const W = $('#viewport').offsetWidth, H = $('#viewport').offsetHeight;
  const mk = (l,t,w,h,label,pos='top') => {
    const d = el('div','ann');
    d.style.cssText = `left:${l}px;top:${t}px;width:${w}px;height:${h}px`;
    d.innerHTML = `<span class="tag" style="${pos==='top'?'left:50%;top:-9px':pos==='bottom'?'left:50%;top:calc(100% + 9px)':'left:calc(100% + 8px);top:50%;transform:translate(0,-50%)'}">${label}</span>`;
    a.appendChild(d);
  };
  const pt = PERF.resolve();
  mk(0, H-48, W, 48,
    pt === 'minimal' ? '任务栏 48px · 纯色不透明（极简档闭模糊）'
    : pt === 'balanced' ? '任务栏 48px · 静态半透明（无实时模糊）'
    : '任务栏 48px · 毛玻璃 blur(22px)', 'top');
  mk(16, 16, 92*4+8*3, 92, '桌面图标网格 92×92 · gap 8px', 'bottom');
  mk(W-360, 16, 344, 132, '通知 Toast 340px · 右上角 16px', 'bottom');
  const note = el('div','ann note');
  note.style.cssText = `left:${Math.round(W/2)-150}px;top:${Math.round(H/2)-90}px;width:300px`;
  note.innerHTML = `<b>窗口规范</b><br>圆角 10px · 标题栏 40px<br>阴影 ${pt==='minimal'?'关闭（描边替代）':'E3 激活 / E2 失焦'}<br>最小尺寸 360×220<br>动效 ${pt==='minimal'?'0ms（仅淡入 120ms）':pt==='balanced'?'200ms':'320ms'}`;
  a.appendChild(note);
  const note2 = el('div','ann note');
  note2.style.cssText = `left:16px;top:${H-260}px;width:260px`;
  note2.innerHTML = `<b>间距 4 的倍数</b><br>4 / 8 / 12 / 16 / 24<br><b>圆角</b> 4·6·8·12·16<br><b>动效</b> 120 / 200 / 320ms`;
  a.appendChild(note2);
}

/* ==========================================================================
   分辨率模拟
   ========================================================================== */
const RES = [
  {label:'800×600',   w:800,  h:600,  scaleHint:'紧凑'},
  {label:'1024×768',  w:1024, h:768,  scaleHint:'紧凑'},
  {label:'1366×768',  w:1366, h:768,  scaleHint:'1.0×'},
  {label:'1600×900',  w:1600, h:900,  scaleHint:'1.0×'},
  {label:'1920×1080', w:1920, h:1080, scaleHint:'1.0×'},
  {label:'2560×1440', w:2560, h:1440, scaleHint:'1.25×'},
  {label:'3840×2160', w:3840, h:2160, scaleHint:'2.0×'},
];
let curResIdx = 4;
const sizeLevel = w => w <= 900 ? 'xs' : w <= 1280 ? 'sm' : w >= 2560 ? 'lg' : 'md';
function setRes(i){
  const r = RES[i]; curResIdx = i;
  const vp = $('#viewport');
  vp.style.width = r.w + 'px'; vp.style.height = r.h + 'px';
  // 密度档位：所有尺度差异由 html[data-size] 统一驱动（不在内联样式上打补丁）
  document.documentElement.dataset.size = sizeLevel(r.w);
  fitViewport();
  // 窗口重新约束到可视区域（最小尺寸随密度档变化）
  const layer = $('#winlayer'), mn = WIN_MIN();
  WM.list.forEach(rec => {
    const w = clamp(rec.win.offsetWidth, mn.w, layer.clientWidth-24);
    const h = clamp(rec.win.offsetHeight, mn.h, layer.clientHeight-24);
    rec.win.style.width = w+'px'; rec.win.style.height = h+'px';
    rec.win.style.left = clamp(rec.win.offsetLeft, 8, Math.max(8, layer.clientWidth - w - 8))+'px';
    rec.win.style.top  = clamp(rec.win.offsetTop, 4, Math.max(4, layer.clientHeight - h - 4))+'px';
    rec.rect = {x:parseFloat(rec.win.style.left), y:parseFloat(rec.win.style.top), w, h};
    if(rec.maximized) WM.applyGeometry(rec,'max');
  });
  fitTaskbar();
  if(document.body.classList.contains('annotate')) drawAnnot();
  $$('#resOpts .opt').forEach((b,j)=>b.classList.toggle('on', j===i));
  hint(`${r.label} · ${sizeLevel(r.w) === 'xs' ? '紧凑密度：任务栏已折叠次要元素' : '建议缩放 ' + r.scaleHint}`);
}
function fitViewport(){
  const vp = $('#viewport'), st = $('#stage');
  const aw = st.clientWidth - 48, ah = st.clientHeight - 48;
  const w = parseFloat(vp.style.width), h = parseFloat(vp.style.height);
  const s = Math.max(0.05, Math.min(aw / w, ah / h, 1));
  vp.style.transform = `scale(${s})`;
  vp.style.margin = `${(h*s-h)/2}px ${(w*s-w)/2}px`;
}
window.addEventListener('resize', () => {
  fitViewport(); fitTaskbar();
  if(document.body.classList.contains('annotate')) drawAnnot();
});

/* ==========================================================================
   性能分级：检测渲染后端 → 自动选档
   无 GPU / llvmpipe 软渲染 → minimal（纯色 + 描边 + 仅 120ms 淡入）
   硬件加速                → balanced（静态半透明 + 静态阴影 + 200ms）
   用户可手动强制任意档位
   ========================================================================== */
const TIER_NAME = {full:'完整', balanced:'均衡', minimal:'极简'};
const PERF = {
  auto: true, mode: 'balanced', detected: null, soft: false,
  detect(){
    let name = '未知（无 WebGL）', soft = true;
    try{
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if(gl){
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        soft = /llvmpipe|swiftshader|softpipe|software|mesa offscreen|basic render/i.test(String(name));
      }
    }catch(e){}
    this.detected = name; this.soft = soft;
    return {name, soft};
  },
  resolve(){ return this.auto ? (this.soft ? 'minimal' : 'balanced') : this.mode; },
  apply(){
    const tier = this.resolve();
    document.body.dataset.perf = tier;
    $$('#dev [data-perf]').forEach(b => b.classList.toggle('on',
      b.dataset.perf === 'auto' ? this.auto : (!this.auto && b.dataset.perf === this.mode)));
    const info = $('#perfInfo');
    if(info){
      const tag = this.soft
        ? '<span style="color:#A32D2D">软件渲染 · 无 GPU 加速</span>'
        : '<span style="color:#3B6D11">硬件加速</span>';
      info.innerHTML = `${tag}<br><span style="color:#86909C">${String(this.detected).slice(0,48)}</span>
        <br>生效档位 <b>${TIER_NAME[tier]}</b>${this.auto ? '（自动）' : '（手动）'}`;
    }
  },
  set(m){ if(m === 'auto') this.auto = true; else { this.auto = false; this.mode = m; } this.apply(); }
};

/* ==========================================================================
   主题
   ========================================================================== */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $$('#dev [data-theme]').forEach(b=>b.classList.toggle('on', b.dataset.theme===t));
  $$('.chip[data-act="theme"]').forEach(b=>b.classList.toggle('on', b.dataset.v===t));
}

/* ==========================================================================
   初始化
   ========================================================================== */
function init(){
  $('#startBtn .ico').innerHTML = `<span style="width:20px;height:20px;display:inline-block;color:currentColor">${icon('start')}</span>`;
  $('#trayNet').innerHTML  = icon('wifi');
  $('#trayVol').innerHTML  = icon('volume');
  $('#trayBat').innerHTML  = icon('battery');
  updateBadge();

  const ro = $('#resOpts');
  RES.forEach((r,i)=>{
    const b = el('button','opt', `${r.label}<span style="opacity:.6"> ${r.scaleHint}</span>`);
    b.addEventListener('click', ()=>setRes(i));
    ro.appendChild(b);
  });
  $$('#dev [data-theme]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));
  $$('#dev [data-perf]').forEach(b=>b.addEventListener('click',()=>{
    PERF.set(b.dataset.perf); hint('性能档位：' + TIER_NAME[PERF.resolve()]);
  }));
  PERF.detect(); PERF.apply();
  $('#btnAnnot').addEventListener('click', toggleAnnot);
  $('#btnNotify').addEventListener('click', ()=>{ notifCount++; updateBadge(); toast('settings','系统更新','检测到 3 个可用更新，点击查看详情'); });
  $('#dev h5').addEventListener('click', ()=>$('#dev').classList.toggle('closed'));
  // 任务栏溢出菜单：把折叠掉的任务按钮、快速启动重新暴露出来
  $('#taskMore').addEventListener('click', e => {
    e.stopPropagation();
    const items = WM.list.map(r => ({
      label: r.title + (r.minimized ? '（已最小化）' : ''),
      icon: APPS[r.app].icon,
      action: () => (r === WM.active && !r.minimized) ? WM.minimize(r) : WM.focus(r),
    }));
    openMenu(e.clientX, e.clientY, items.length ? items : [{label:'暂无打开的窗口'}]);
  });
  $('#quickMore').innerHTML = icon('chevronR');
  $('#quickMore').addEventListener('click', e => {
    e.stopPropagation();
    openMenu(e.clientX, e.clientY, QUICK.map(k => ({label:APPS[k].name, icon:APPS[k].icon, action:()=>launch(k)})));
  });

  syncModuleApps();                      // 已安装模块 → 注册为可单独启动的 .desktop 入口
  renderIcons(); renderQuick(); renderStart(); renderModOpts();
  setRes(4);                             // 1920×1080
  WM.open('files');
  setTimeout(()=>WM.open('settings'), 240);
  setTimeout(()=>WM.open('terminal'), 520);
  setTimeout(()=>{ toast('files','同步完成','「项目文档」已同步至本地，共 12 项'); }, 1200);
  setTimeout(()=>hint('设置 = 纯壳：每个模块一个 DEB 包，卸掉即消失，也可从「设置」分类单独启动'), 2400);
  fitTaskbar();
}
init();
</script>
